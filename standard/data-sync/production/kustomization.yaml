apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base-rendered.yaml   # output of `helm template` for the production values, see above

patches:
  - target:
      kind: Deployment
      name: data-sync
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: data-sync
                app.kubernetes.io/instance: data-sync
      - op: add
        path: /spec/template/metadata/annotations/SECRET_CHECKSUM
        value: "986c0b9dd0297bddeb114fb8d5b677a2ea38a78304442d8badaa98debcf96ba7"
