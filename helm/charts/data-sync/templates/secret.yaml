apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-sync.fullname" . }}
  labels:
    {{- include "data-sync.labels" . | nindent 4 }}
type: Opaque
stringData:
  # NOTE: passing secrets through --set / values.yaml is fine for local kind smoke-testing.
  # In staging/production this value should come from a real secret manager
  # (GCP Secret Manager + External Secrets Operator, or Sealed Secrets) instead of
  # living in a values file. See README "Secret handling" section.
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
